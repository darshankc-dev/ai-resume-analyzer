# ===================================================================
# AI Resume Analyzer — Application Configuration
# ===================================================================

# ---- Server ----
server.port=8080

# ---- PostgreSQL Datasource ----
# Replace these placeholder values with your actual database credentials.
# TIP: Use environment variables in production (e.g., ${DB_URL})
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_resume_analyzer
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- DevTools ----
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Google Gemini AI Configuration ----
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}


